<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aurial</title>
<style>
:root {
  --bg: #f4f5f9;
  --panel: #ffffff;
  --panel-2: #f8f9fc;
  --border: #e4e7ee;
  --text: #121826;
  --muted: #6b7385;
  --accent: #6d5efc;
  --accent-2: #8f84ff;
  --accent-soft: rgba(109, 94, 252, 0.12);
  --danger: #e5484d;
  --shadow: 0 18px 50px rgba(18, 24, 38, 0.16), 0 2px 6px rgba(18, 24, 38, 0.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1015;
    --panel: #171a22;
    --panel-2: #1d212b;
    --border: #2a2f3b;
    --text: #e8eaf0;
    --muted: #98a0b3;
    --accent: #8578ff;
    --accent-2: #a49bff;
    --accent-soft: rgba(133, 120, 255, 0.16);
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1015;
  --panel: #171a22;
  --panel-2: #1d212b;
  --border: #2a2f3b;
  --text: #e8eaf0;
  --muted: #98a0b3;
  --accent: #8578ff;
  --accent-2: #a49bff;
  --accent-soft: rgba(133, 120, 255, 0.16);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hidden { display: none !important; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--panel);
  cursor: pointer; font-weight: 600; white-space: nowrap;
  transition: transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover { border-color: var(--accent-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(109, 94, 252, .35); }
.btn.primary:hover { background: var(--accent-2); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center;
  border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer;
  color: var(--muted); transition: background .15s, color .15s, transform .12s;
}
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }
.icon-btn:disabled { opacity: .35; pointer-events: none; }

/* ---------- dashboard ---------- */
#dash { height: 100%; overflow: auto; }
.dash-top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 28px; background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.logo {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: conic-gradient(from 200deg, #ffb347, #ff6a88, #6d5efc, #38bdf8, #ffb347);
  color: #fff; box-shadow: 0 6px 16px rgba(109, 94, 252, .35);
}
.spacer { flex: 1; }
.dash-main { max-width: 1180px; margin: 0 auto; padding: 32px 28px 60px; }
.dash-main h1 { font-size: 30px; letter-spacing: -.02em; margin: 0 0 6px; }
.muted { color: var(--muted); }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; margin-top: 26px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  cursor: pointer; position: relative; transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: transparent; }
.card .thumb { aspect-ratio: 16 / 10; background: #fff; display: block; width: 100%; object-fit: cover; border-bottom: 1px solid var(--border); }
.card .thumb.empty {
  background-color: #fff;
  background-image: radial-gradient(#cfd5df 1.3px, transparent 1.4px);
  background-size: 18px 18px;
}
.card .meta { padding: 12px 14px 14px; }
.card .name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card .acts {
  position: absolute; top: 10px; right: 10px; display: flex; gap: 4px;
  opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s;
}
.card:hover .acts, .card:focus-within .acts { opacity: 1; transform: none; }
.card .acts .icon-btn { background: rgba(255, 255, 255, .92); color: #374151; width: 32px; height: 32px; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.card .acts .icon-btn:hover { color: var(--accent); }
.card .acts .icon-btn.del:hover { color: var(--danger); }
.card.new {
  display: grid; place-items: center; min-height: 220px; border: 2px dashed var(--border); background: transparent;
  color: var(--muted); font-weight: 700;
}
.card.new:hover { color: var(--accent); border-color: var(--accent-2); box-shadow: none; }
.card.new .plus { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 10px; }
@media (hover: none) { .card .acts { opacity: 1; transform: none; } }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(10, 12, 20, .45); backdrop-filter: blur(3px); animation: fade .15s ease; }
.modal .box { width: min(560px, 100%); background: var(--panel); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); animation: pop .22s cubic-bezier(.2, 1.4, .4, 1); max-height: 92vh; overflow: auto; }
.modal h2 { margin: 0 0 14px; font-size: 20px; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.inp {
  width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2);
  padding: 0 12px; font: inherit; color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
}
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.tpl {
  border: 2px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; text-align: left; background: var(--panel-2);
  transition: border-color .15s, transform .12s;
}
.tpl:hover { transform: translateY(-2px); }
.tpl.on { border-color: var(--accent); background: var(--accent-soft); }
.tpl b { display: block; margin-top: 8px; }
.tpl span { font-size: 12px; color: var(--muted); }
.tpl .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--panel); display: grid; place-items: center; color: var(--accent); }
@media (max-width: 520px) { .tpl-grid { grid-template-columns: 1fr; } }

/* ---------- editor ---------- */
#editor { position: fixed; inset: 0; display: grid; grid-template-columns: 208px 1fr; grid-template-rows: 58px 1fr; }
.ed-top {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--border); z-index: 10; min-width: 0;
}
.ed-top .pname {
  border: 1px solid transparent; background: transparent; font: inherit; font-weight: 700; font-size: 16px; color: var(--text);
  padding: 6px 8px; border-radius: 8px; min-width: 60px; max-width: 260px; outline: none;
}
.ed-top .pname:hover { border-color: var(--border); }
.ed-top .pname:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex: none; }
.grp { display: flex; align-items: center; gap: 2px; flex: none; }
.gsz { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
.gsz button { border: 0; background: transparent; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); }
.gsz button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.zoomlbl { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; border: 0; background: transparent; }
.top-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.top-scroll::-webkit-scrollbar { display: none; }

.palette { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 10px 24px; z-index: 5; }
.pgroup h4 { margin: 14px 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pgroup:first-child h4 { margin-top: 4px; }
.pitems { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pitem {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  height: 66px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2);
  cursor: grab; user-select: none; touch-action: none; font-size: 11.5px; font-weight: 600; color: var(--text);
  transition: border-color .15s, background .15s, transform .12s, box-shadow .15s; position: relative;
}
.pitem svg.i { width: 24px; height: 24px; color: var(--muted); transition: color .15s; }
.pitem:hover { border-color: var(--accent-2); }
.pitem:hover svg.i { color: var(--accent); }
.pitem:active { transform: scale(.96); }
.pitem.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pitem.on svg.i { color: var(--accent); }
.pitem .k { position: absolute; top: 4px; right: 6px; font-size: 9.5px; color: var(--muted); font-weight: 700; opacity: .7; }

.stage { position: relative; overflow: hidden; background: #fff; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hint {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 4;
  background: rgba(18, 24, 38, .86); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 12.5px;
  pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  transition: opacity .2s;
}
.status {
  position: absolute; left: 12px; bottom: 12px; z-index: 4; font-size: 11.5px; color: #4b5563;
  background: rgba(255, 255, 255, .9); border: 1px solid #e5e7eb; padding: 5px 10px; border-radius: 999px;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.ghost {
  position: fixed; z-index: 200; pointer-events: none; width: 56px; height: 56px; border-radius: 14px;
  background: var(--panel); border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent);
  box-shadow: var(--shadow); transform: translate(-50%, -50%) scale(1.05);
}
.ghost svg.i { width: 28px; height: 28px; }
.press {
  position: fixed; z-index: 150; width: 54px; height: 54px; margin: -27px 0 0 -27px; pointer-events: none;
}
.press circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 145; stroke-dashoffset: 145; transform: rotate(-90deg); transform-origin: 50% 50%; }
.press.run circle { animation: press .42s .1s linear forwards; }
@keyframes press { to { stroke-dashoffset: 0; } }

/* ---------- popup ---------- */
.popup {
  position: fixed; z-index: 60; width: 296px; max-height: calc(100vh - 80px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
  transform-origin: var(--ox, 0) var(--oy, 0); animation: pop .24s cubic-bezier(.2, 1.35, .4, 1);
  scrollbar-width: thin;
}
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
.pp-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.pp-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: none; }
.pp-ic svg.i { width: 22px; height: 22px; }
.pp-title { flex: 1; min-width: 0; }
.pp-title small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.pp-title input { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 15px; color: var(--text); padding: 0; outline: none; }
.pp-body { padding: 2px 14px 6px; }
.fld { padding: 9px 0; border-top: 1px solid var(--border); }
.fld:first-child { border-top: 0; }
.fld-h { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
.fld-h .v { color: var(--text); font-variant-numeric: tabular-nums; background: var(--panel-2); padding: 1px 8px; border-radius: 6px; }
input[type=range].rng {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer;
  --p: 50%; --track: linear-gradient(90deg, var(--accent) var(--p), var(--border) var(--p));
}
input[type=range].rng::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: var(--track); }
input[type=range].rng::-moz-range-track { height: 6px; border-radius: 99px; background: var(--track); }
input[type=range].rng::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-top: -6px;
  border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .12s;
}
input[type=range].rng::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
input[type=range].rng:active::-webkit-slider-thumb { transform: scale(1.2); }
input[type=range].rng.kel { --track: linear-gradient(90deg, #ff7018, #ff9228, #ffb234, #ffd66e, #d6e2be, #82beff, #6096ff, #486eff); }
.sw { display: flex; flex-wrap: wrap; gap: 7px; }
.sw button {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--border);
  cursor: pointer; padding: 0; transition: transform .12s, box-shadow .12s; position: relative;
}
.sw button:hover { transform: scale(1.12); }
.sw button.on { box-shadow: 0 0 0 2px var(--accent); }
.sw button.none { background: repeating-linear-gradient(45deg, #fff 0 4px, #e5e7eb 4px 8px) !important; }
.sw label.custom {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer; position: relative; overflow: hidden;
  background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); box-shadow: 0 0 0 1px var(--border);
}
.sw label.custom input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.gel-row button { width: auto; min-width: 26px; padding: 0 9px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #111; height: 26px; }
.seg { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 6px 4px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.seg button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }
.tgl { display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 13px; font-weight: 600; }
.tgl input { display: none; }
.tgl .sl { width: 42px; height: 24px; border-radius: 99px; background: var(--border); position: relative; transition: background .2s; flex: none; }
.tgl .sl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .22s cubic-bezier(.3, 1.5, .5, 1); }
.tgl input:checked + .sl { background: var(--accent); }
.tgl input:checked + .sl::after { transform: translateX(18px); }
.dial-row { display: flex; align-items: center; gap: 14px; }
.dial { width: 64px; height: 64px; flex: none; cursor: grab; touch-action: none; }
.dial:active { cursor: grabbing; }
.dial-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text); }
.chip:hover { border-color: var(--accent-2); color: var(--accent); }
textarea.inp { height: auto; min-height: 70px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
.pp-foot { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--panel); }
.pp-foot .btn { flex: 1; justify-content: center; height: 36px; font-size: 13px; }
.pp-foot .btn.del { color: var(--danger); }
.pp-foot .btn.del:hover { border-color: var(--danger); }
.pp-x { margin-left: auto; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300;
  background: #121826; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px;
  box-shadow: var(--shadow); animation: pop .25s cubic-bezier(.2, 1.35, .4, 1);
}

/* =============== fancy studio theme (the editor is always dark) =============== */
#dash {
  background:
    radial-gradient(1100px 560px at 8% -12%, rgba(139, 124, 255, .20), transparent 60%),
    radial-gradient(900px 520px at 105% -5%, rgba(56, 189, 248, .16), transparent 60%),
    radial-gradient(900px 600px at 50% 115%, rgba(251, 146, 60, .14), transparent 60%),
    var(--bg);
}
.dash-top { background: rgba(23, 26, 33, .6); border-bottom-color: rgba(255, 255, 255, .06); }
.dash-main h1 {
  background: linear-gradient(90deg, var(--text) 30%, var(--accent) 70%, #38bdf8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.btn.primary {
  background: linear-gradient(135deg, #9b8cff, #6d5efc 50%, #4f8cff); border-color: transparent;
  box-shadow: 0 8px 26px rgba(109, 94, 252, .45), inset 0 1px 0 rgba(255, 255, 255, .25);
}
.btn.primary:hover { background: linear-gradient(135deg, #ab9eff, #7d6fff 50%, #60a0ff); box-shadow: 0 10px 32px rgba(109, 94, 252, .6), 0 0 24px rgba(79, 140, 255, .35); }
.card { box-shadow: 0 10px 30px rgba(18, 24, 38, .10); }
.card:hover { box-shadow: 0 22px 50px rgba(18, 24, 38, .20), 0 0 0 1px var(--accent-2), 0 0 40px rgba(139, 124, 255, .30); }
.card .thumb, .card .thumb.empty { background-color: #363c48; }
.card .thumb.empty { background-image: radial-gradient(rgba(130, 170, 255, .55) 1.3px, transparent 1.5px); }
.card.new { background: color-mix(in srgb, var(--panel) 40%, transparent); }
.card.new:hover { box-shadow: 0 0 30px rgba(139, 124, 255, .25); }
.card.new .plus { background: linear-gradient(135deg, #9b8cff, #4f8cff); color: #fff; box-shadow: 0 0 22px rgba(109, 94, 252, .5); }
.logo { box-shadow: 0 6px 16px rgba(109, 94, 252, .35), 0 0 22px rgba(255, 106, 136, .35); }

#dash, .modal .box {
  --bg: #171a21; --panel: #1f232c; --panel-2: rgba(255, 255, 255, .05); --border: rgba(255, 255, 255, .08);
  --text: #e9edf5; --muted: #98a2b6; --accent: #9b8cff; --accent-2: #b3a8ff; --accent-soft: rgba(139, 124, 255, .18);
  color: var(--text); color-scheme: dark;
}
#dash {
  background:
    radial-gradient(900px 520px at 6% -10%, rgba(139, 124, 255, .32), transparent 60%),
    radial-gradient(800px 480px at 104% -4%, rgba(56, 189, 248, .24), transparent 60%),
    radial-gradient(900px 600px at 50% 118%, rgba(251, 146, 60, .22), transparent 60%),
    #171a21;
}
#dash .card { background: linear-gradient(160deg, #252a35, #1c2029); border-color: rgba(255, 255, 255, .07); box-shadow: 0 14px 34px rgba(0, 0, 0, .45); }
#dash .card.new { background: rgba(255, 255, 255, .03); border-color: rgba(255, 255, 255, .12); }
#dash .btn:not(.primary) { background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)); border-color: rgba(255, 255, 255, .1); }
.modal .box { box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(139, 124, 255, .2), 0 0 50px rgba(139, 124, 255, .2); }
.modal .tpl { background: rgba(255, 255, 255, .04); border-color: rgba(255, 255, 255, .08); }

.pgroup h4 { color: var(--gc); display: flex; align-items: center; gap: 7px; }

.pitem:hover svg.i { color: var(--gc); filter: drop-shadow(0 0 10px var(--gc)); }

#editor .btn { background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)); border-color: rgba(255, 255, 255, .1); box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
#editor .btn:hover { border-color: rgba(139, 124, 255, .7); box-shadow: 0 0 22px rgba(139, 124, 255, .4); }
.stage { background: #363c48; }

.status { background: rgba(20, 23, 30, .72); color: #b9c2d4; border-color: rgba(255, 255, 255, .08); backdrop-filter: blur(10px); box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
.popup {
  background: rgba(26, 30, 39, .88); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, .09);
  box-shadow: 0 28px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(139, 124, 255, .18), 0 0 46px rgba(139, 124, 255, .18);
}
.pp-head, .pp-foot { background: rgba(27, 31, 40, .96); }
.pp-ic { box-shadow: 0 0 22px var(--icg), inset 0 1px 0 rgba(255, 255, 255, .35); }
.fld { border-top-color: rgba(255, 255, 255, .06); }

input[type=range].rng { --track: linear-gradient(90deg, #9b8cff 0, #38bdf8 var(--p), rgba(255, 255, 255, .12) var(--p)); }
input[type=range].rng::-webkit-slider-thumb { border-color: #b3a8ff; box-shadow: 0 0 0 4px rgba(139, 124, 255, .2), 0 0 16px rgba(139, 124, 255, .75); }
input[type=range].rng::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(139, 124, 255, .2), 0 0 16px rgba(139, 124, 255, .75); }
input[type=range].rng.kel { --track: linear-gradient(90deg, #ff7018, #ff9228, #ffb234, #ffd66e, #d6e2be, #82beff, #6096ff, #486eff); }
.tgl input:checked + .sl { background: linear-gradient(90deg, #9b8cff, #38bdf8); box-shadow: 0 0 16px rgba(139, 124, 255, .6); }

.sw button { border-color: #1d212a; box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 3px 8px rgba(0, 0, 0, .35); }

.chip { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .09); }

.toast { background: linear-gradient(135deg, rgba(36, 40, 52, .95), rgba(26, 30, 39, .95)); border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 16px 40px rgba(0, 0, 0, .45), 0 0 26px rgba(139, 124, 255, .35); }
.press circle { stroke: #b3a8ff; filter: drop-shadow(0 0 6px #8b7cff); }
@media (prefers-reduced-motion: reduce) { .popup, .modal .box, .toast { animation: none; } .pv-dot { animation: none; } }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes ipop { 0% { transform: scale(.7) rotate(-12deg); } 60% { transform: scale(1.18) rotate(4deg); } 100% { transform: none; } }
@keyframes breathe { 50% { box-shadow: 0 0 0 1px var(--gc), 0 0 36px color-mix(in srgb, var(--gc) 65%, transparent); } }
@keyframes flow { to { background-position: 200% 0; } }
@keyframes hue { to { filter: hue-rotate(360deg); } }
@keyframes popout { to { opacity: 0; transform: scale(.94); } }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastout { to { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes sheen { from { transform: translateX(-120%) skewX(-20deg); } to { transform: translateX(260%) skewX(-20deg); } }
.card { animation: rise .55s cubic-bezier(.2, .9, .3, 1.15) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
.card .thumb { transition: transform .6s cubic-bezier(.2, .8, .2, 1), filter .4s; }
.card:hover .thumb { transform: scale(1.05); filter: saturate(1.2) brightness(1.06); }
.card.new .plus { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.card.new:hover .plus { transform: rotate(90deg) scale(1.1); }
.dash-main h1, .dash-main > .muted { animation: dropIn .5s ease backwards; }
.dash-main > .muted { animation-delay: .06s; }
.logo { animation: hue 14s linear infinite; }
.btn { position: relative; overflow: hidden; }
.btn.primary::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); transform: translateX(-120%) skewX(-20deg);
}
.btn.primary:hover::after { animation: sheen .8s ease; }
#editor:not(.hidden) .ed-top { animation: dropIn .4s ease backwards; }
#editor:not(.hidden) .stage { animation: fadeIn .5s ease backwards; }
.pitem { animation: slideIn .4s cubic-bezier(.2, .9, .3, 1.1) backwards; animation-delay: calc(var(--d, 0) * 22ms + 80ms); }
.pitem svg.i { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), color .15s, filter .2s; }
.pitem:hover svg.i { transform: translateY(-1px) scale(1.12); }
.pitem.on { animation: breathe 2.6s ease-in-out infinite; }
.icon-btn svg.i { transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
.icon-btn:hover svg.i { transform: scale(1.1); }
.icon-btn.on svg.i { animation: ipop .4s ease; }
.ed-top::after { background-size: 200% 100%; animation: flow 9s linear infinite alternate; }
.popup.closing { animation: popout .14s ease forwards; pointer-events: none; }
.popup.fresh .fld { animation: rise .35s cubic-bezier(.2, .9, .3, 1.1) backwards; animation-delay: calc(var(--i, 0) * 28ms + 40ms); }
.toast { animation: toastin .32s cubic-bezier(.2, 1.3, .4, 1) both; }
.toast.out { animation: toastout .3s ease forwards; }
.hint { transition: opacity .25s ease, transform .3s cubic-bezier(.2, .9, .3, 1.2); }
.gsz button, .seg button { transition: background .2s, color .2s, box-shadow .25s, transform .15s; }
.gsz button:active, .seg button:active, .sw button:active, .chip:active { transform: scale(.92); }
.tpl .ic { transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.tpl:hover .ic { transform: rotate(-6deg) scale(1.08); }

/* ---------- press-and-hold, gobo picker, RGB ---------- */
@property --pp { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
.press { position: fixed; z-index: 150; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none; }
.press-ring {
  position: absolute; inset: 0; border-radius: 50%; --pp: 0%;
  background: conic-gradient(from -90deg, #8b7cff 0%, #f472b6 calc(var(--pp) * .6), #fde68a var(--pp), rgba(255, 255, 255, .1) var(--pp));
  -webkit-mask: radial-gradient(circle, transparent 31px, #000 32px, #000 38px, transparent 39px);
  mask: radial-gradient(circle, transparent 31px, #000 32px, #000 38px, transparent 39px);
  filter: drop-shadow(0 0 6px rgba(244, 114, 182, .8));
}
.press-glow {
  position: absolute; inset: -28px; border-radius: 50%; opacity: 0; transform: scale(.4);
  background: radial-gradient(circle, rgba(253, 230, 138, .6), rgba(244, 114, 182, .45) 30%, rgba(139, 124, 255, .3) 55%, transparent 72%);
}
.press.run .press-ring { animation: pressfill .6s .08s linear forwards; }
.press.run .press-glow { animation: pressglow .6s .08s ease-in forwards; }
.press.done { animation: pressburst .32s ease-out forwards; }
@keyframes pressfill { to { --pp: 100%; } }
@keyframes pressglow { to { opacity: 1; transform: scale(1.12); } }
@keyframes pressburst { to { opacity: 0; transform: scale(1.7); } }
.gobo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gobo-grid button {
  border: 1px solid rgba(255, 255, 255, .08); background: rgba(255, 255, 255, .04); border-radius: 10px; padding: 5px 2px 4px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted);
  transition: transform .15s, box-shadow .2s, border-color .2s;
}
.gobo-grid img { width: 38px; height: 38px; border-radius: 50%; display: block; }
.gobo-grid button:hover { transform: translateY(-1px); border-color: rgba(251, 191, 36, .5); }
.gobo-grid button.on { border-color: #fbbf24; color: #fde68a; box-shadow: 0 0 16px rgba(251, 191, 36, .45); }
input[type=range].rng.hue { --track: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }

/* ---------- mini 3D view in the popup ---------- */
.mv { position: relative; height: 176px; margin: 2px 0 10px; border-radius: 12px; overflow: hidden; background: #14171d; border: 1px solid rgba(255, 255, 255, .08); box-shadow: inset 0 0 30px rgba(0, 0, 0, .5); }
.mv.off { display: none; }
.mv-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.mv-hud { position: absolute; left: 8px; top: 8px; z-index: 2; font-size: 11px; font-weight: 700; color: #e9edf5; background: rgba(15, 17, 23, .72); padding: 3px 9px; border-radius: 99px; pointer-events: none; font-variant-numeric: tabular-nums; }
.mv-tip { position: absolute; left: 8px; right: 8px; bottom: 6px; z-index: 2; font-size: 10px; color: rgba(255, 255, 255, .55); pointer-events: none; }

/* ---------- 3D camera preview ---------- */
.pv {
  position: absolute; top: 12px; right: 12px; z-index: 6; width: 380px; height: 240px; min-width: 200px; min-height: 140px;
  display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: #111419;
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: 0 22px 56px rgba(0, 0, 0, .6), 0 0 0 1px rgba(139, 124, 255, .22), 0 0 40px rgba(139, 124, 255, .25);
}
.pv-head {
  height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: linear-gradient(180deg, rgba(40, 45, 58, .98), rgba(27, 31, 40, .98)); border-bottom: 1px solid rgba(255, 255, 255, .06); font-size: 12px;
}
.pv-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444; animation: rec 1.6s ease-in-out infinite; flex: none; }
@keyframes rec { 50% { opacity: .3; } }
.pv select { background: transparent; color: var(--text); border: 0; font: inherit; font-weight: 700; outline: none; cursor: pointer; max-width: 45%; }
.pv select option { background: #1d212a; color: #e9edf5; }
.pv-meta { flex: 1; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-body { position: relative; flex: 1; min-height: 0; background: #1b1f27; }
.pv-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pv-frame {
  position: absolute; inset: 10px; pointer-events: none; opacity: .6;
  background:
    linear-gradient(#fff, #fff) left top / 16px 1.5px no-repeat, linear-gradient(#fff, #fff) left top / 1.5px 16px no-repeat,
    linear-gradient(#fff, #fff) right top / 16px 1.5px no-repeat, linear-gradient(#fff, #fff) right top / 1.5px 16px no-repeat,
    linear-gradient(#fff, #fff) left bottom / 16px 1.5px no-repeat, linear-gradient(#fff, #fff) left bottom / 1.5px 16px no-repeat,
    linear-gradient(#fff, #fff) right bottom / 16px 1.5px no-repeat, linear-gradient(#fff, #fff) right bottom / 1.5px 16px no-repeat;
}
.pv-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 18px; color: var(--muted); font-size: 12.5px; }
.pv-msg[hidden] { display: none; }
.pv-grip { position: absolute; left: 0; bottom: 0; width: 30px; height: 30px; cursor: nesw-resize; touch-action: none; z-index: 2; }
.pv-grip::after {
  content: ""; position: absolute; left: 8px; bottom: 8px; width: 12px; height: 12px; border-radius: 50%;
  background: #8b7cff; border: 2px solid #fff; box-shadow: 0 0 12px rgba(139, 124, 255, .95); transition: transform .15s;
}
.pv-grip:hover::after { transform: scale(1.3); }
@media (max-width: 760px) { .pv { top: 8px; right: 8px; } }
.pv:not(.hidden) { animation: pop .35s cubic-bezier(.2, 1.35, .4, 1); transform-origin: top right; }
.pv-body.switch canvas { animation: fadeIn .45s ease; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}

@media (max-width: 760px) {
  #editor { grid-template-columns: 1fr; grid-template-rows: 54px 1fr 84px; }
  .palette { grid-row: 3; border-right: 0; border-top: 1px solid var(--border); display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; padding: 8px 10px; }
  .pgroup { display: flex; align-items: center; gap: 6px; flex: none; }
  .pgroup h4 { display: none; }
  .pitems { display: flex; gap: 6px; }
  .pitem { width: 64px; height: 64px; flex: none; }
  .pitem .k { display: none; }
  .stage { grid-row: 2; }
  .dash-top { padding: 12px 16px; }
  .dash-main { padding: 22px 16px 40px; }
  .ed-top .pname { max-width: 120px; }
  .hide-sm { display: none !important; }
  .popup { left: 8px !important; right: 8px; top: auto !important; bottom: 92px; width: auto; max-height: 58vh; }
}
/* ---------- view switch (light / camera cones) ---------- */
.vseg button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; }
.vseg svg.i { width: 15px; height: 15px; }
@media (max-width: 760px) { .vseg button { font-size: 0; gap: 0; padding: 5px 7px; } }

/* ---------- sidebar: plain white items, no boxes or glow ---------- */
.pgroup h4 { color: rgba(255, 255, 255, .55); }
.pgroup h4::before { display: none; }
.pitem, .pitem:hover, .pitem.on {
  background: none; border-color: transparent; box-shadow: none; color: #fff;
}
.pitem.on { animation: none; }
.pitem svg.i, .pitem:hover svg.i, .pitem.on svg.i { color: #fff; filter: none; }
.pitem { opacity: .78; transition: opacity .15s, transform .15s; }
.pitem:hover { opacity: 1; transform: translateY(-1px); }
.pitem.on { opacity: 1; }
.pitem.on::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
.pitem .k { color: rgba(255, 255, 255, .4); }
/* ---------- logo: a glowing sun ---------- */
.logo {
  width: 36px; height: 36px; border-radius: 50%; animation: none; color: #ffd76a;
  background: radial-gradient(circle, rgba(255, 214, 110, .35) 0%, rgba(255, 160, 60, .14) 45%, transparent 70%);
  box-shadow: none;
}
.logo .sun { width: 36px; height: 36px; overflow: visible; filter: drop-shadow(0 0 4px rgba(255, 200, 90, .95)) drop-shadow(0 0 12px rgba(255, 150, 50, .7)); }
.logo .rays { fill: #ffc65c; transform-origin: 20px 20px; animation: sunspin 40s linear infinite; }
.logo circle { animation: sunpulse 3.2s ease-in-out infinite; transform-origin: 20px 20px; }
@keyframes sunspin { to { transform: rotate(360deg); } }
@keyframes sunpulse { 50% { transform: scale(1.06); } }
.brand { letter-spacing: .01em; }
</style>
</head>

    <div class="spacer"></div>

/* =====================================================================
   Storage (browser localStorage with in-memory fallback)
   ===================================================================== */
const STORE_KEY = 'lichtplan.projects.v1';
let projects = null;
function loadProjects() {
  if (projects) return projects;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    projects = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(projects)) projects = [];
  } catch (_) { projects = []; }
  return projects;
}
function persistProjects() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(projects)); } catch (_) { /* private mode / quota: keep in memory */ }
  Cloud.sync();
}

/* Optional cloud storage: when hosted as a claude.ai artifact the page keeps
   each project as a private per-user document. Standalone it is a no-op. */
const Cloud = {
  db: null, col: null, written: new Map(), busy: new Set(), again: new Set(),
  async init(onLoaded) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const col = db.collection('data/users/' + id);
      const snap = await Promise.race([col.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
      this.db = db; this.col = col;
      const remote = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id })).filter((p) => p && p.data);
      const list = loadProjects();
      const byIdR = new Map(remote.map((p) => [p.id, p]));
      for (const p of remote) this.written.set(p.id, JSON.stringify(p));
      // merge: newest version of each project wins
      const merged = remote.slice();
      for (const p of list) {
        const r = byIdR.get(p.id);
        if (!r) { if (!(remote.length && p.name === 'Voorbeeld: interview')) merged.push(p); }
        else if ((p.updated || 0) > (r.updated || 0)) merged[merged.indexOf(r)] = p;
      }
      projects = merged;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(projects)); } catch (_) { /* ignore */ }
      this.sync();
      if (onLoaded) onLoaded();
    } catch (_) { /* stay local */ }
  },
  sync() {
    if (!this.col) return;
    const live = new Set(projects.map((p) => p.id));
    for (const p of projects) {
      const body = JSON.stringify(p);
      if (this.written.get(p.id) !== body) this.write(p.id, () => JSON.parse(JSON.stringify(projects.find((x) => x.id === p.id) || null)));
    }
    for (const id of [...this.written.keys()]) if (!live.has(id)) this.write(id, () => null);
  },
  async write(id, getBody) {
    if (this.busy.has(id)) { this.again.add(id); return; }
    this.busy.add(id);
    try {
      const body = getBody();
      const ref = this.col.doc(id);
      if (body) {
        const snapStr = JSON.stringify(body);
        delete body.id;
        await ref.set(body);
        this.written.set(id, snapStr);
      }
      else { await ref.delete(); this.written.delete(id); }
    } catch (e) {
      if (e && e.code === 'quota_exceeded' && typeof toast === 'function') toast('Opslag vol: exporteer of verwijder oude projecten');
      this.written.set(id, 'error');
    } finally {
      this.busy.delete(id);
      if (this.again.delete(id)) this.sync();
    }
  },
};

/* Full scene. o: {S, W, H, V, items, grid, gridSize, light, lightAlpha, cones, mag, t, spawn}

/* Reusable offscreen layer: redrawn only when its key changes. */
function layer(cache, name, w, h, key, paint) {
  let l = cache[name];
  if (!l) l = cache[name] = { cv: document.createElement('canvas'), key: null };
  if (l.cv.width !== w || l.cv.height !== h) { l.cv.width = w; l.cv.height = h; l.key = null; }
  if (l.key !== key) {
    const c = l.cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    paint(c);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.shadowColor = 'transparent';
    l.key = key;
  }

}

  '#' + opens.map((d) => d.id + ':' + d.type + d.x + ',' + d.y + ',' + d.rot + ',' + d.w + ',' + (d.flip ? 1 : 0) + (d.swap ? 1 : 0) + ',' + (d.thick || 15)).join('|');

  const { S, W, H, V, items } = o;

  const T = [S * V.z, S * V.x, S * V.y];

  for (const it of items) (by[it.type] = by[it.type] || []).push(it);
  const L = (t) => by[t] || [];
  const opens = L('door').concat(L('window'));
  const spawn = o.spawn;
  const wsig = C ? wallSig(L('wall'), opens) : '';
  let rooms;
  if (C && C.roomsKey === wsig) rooms = C.rooms;
  else { rooms = findRooms(L('wall')); if (C) { C.rooms = rooms; C.roomsKey = wsig; } }
  const ga = typeof o.grid === 'number' ? o.grid : (o.grid ? 1 : 0);
  const paintBase = (c) => {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.shadowColor = 'transparent';
    const bg = c.createRadialGradient(W * S * 0.45, H * S * 0.4, 0, W * S * 0.5, H * S * 0.5, Math.max(W, H) * S * 0.8);
    bg.addColorStop(0, '#454c5a');
    bg.addColorStop(1, '#2c313b');

    c.fillRect(0, 0, W * S, H * S);
    c.setTransform(T[0], 0, 0, T[0], T[1], T[2]);

    const camPop = spawn && ANIM_T != null && cams.some((c) => spawn.has(c.id));
    if (C && !camPop) {
      const key = [ctx.canvas.width, ctx.canvas.height, V.x, V.y, V.z, ca.toFixed(3)].concat(cams.map((c) => c.id + c.x + ',' + c.y + ',' + c.rot + ',' + c.fov + ',' + c.range + c.color)).join('|');

      C.coneSegs = segs;

    ctx.restore();

  for (const it of L('person')) P(it, () => drawPerson(ctx, it, px));

  for (const it of L('camera')) P(it, () => drawCamera(ctx, it, px));
  for (const it of L('link')) P(it, () => drawLink(ctx, it, items, px));
  for (const it of L('text')) P(it, () => drawText(ctx, it, px));

function renderToCanvas(items, settings, maxW, maxH, S, pad) {

    const lens = G(new T.Mesh(new T.CircleGeometry(5.8, 24), new T.MeshPhongMaterial({ color: '#0b1220', specular: '#8fb4ff', shininess: 200 })), 31.1, 0, 0);
    lens.rotation.y = Math.PI / 2;
    for (const [w2, h2, d2, y, z] of [[10, 0.6, 24, 8, 0], [10, 0.6, 24, -8, 0], [10, 16, 0.6, 0, 12], [10, 16, 0.6, 0, -12]]) G(box(w2, h2, d2, blackM), 36, y, z);
    G(box(1, 7, 11, blackM), -6, 12, -9).rotation.y = -0.4;
    G(cyl(2.2, 2.2, 6, blackM, 16), -18, 3, -4).rotation.z = Math.PI / 2;
    add(at(cyl(7, 7, 4, blackM, 20), c.x, ch - 10, c.y));
    for (let k = 0; k < 3; k++) {
      const a = k * 2.094 + 0.3;
      rod(V3(c.x, ch - 12, c.y), V3(c.x + Math.cos(a) * 48, 1, c.y + Math.sin(a) * 48), 1.3, metal);
      rod(V3(c.x + Math.cos(a) * 14, ch * 0.45, c.y + Math.sin(a) * 14), V3(c.x, ch * 0.42, c.y), 0.6, metal);
    }
  }
  return sc;
}

function pvTick() {
  if (!ED.settings.preview || !PV.renderer) return;
  const cams = ED.items.filter((i) => i.type === 'camera');
  const sig = cams.map((c) => c.id + ':' + c.label).join('|');
  if (sig !== PV.camSig) {
    PV.camSig = sig;
    pvSel.innerHTML = cams.map((c) => `<option value="${esc(c.id)}">${esc(c.label || 'Camera')}</option>`).join('');
    PV.builtVer = -1;
  }
  const sel = byId(ED.sel);
  if (sel && sel.type === 'camera' && PV.camId !== sel.id) { PV.camId = sel.id; PV.builtVer = -1; pvFlash(); }
  if (!cams.some((c) => c.id === PV.camId)) { PV.camId = cams[0] ? cams[0].id : null; PV.builtVer = -1; }
  if (PV.camId && pvSel.value !== PV.camId) pvSel.value = PV.camId;
  const now = performance.now();
  const busy = !!(drag || pinch || MV.drag);
  if (!(PV.builtVer !== ED.ver || anim.size || PV.sizeDirty) || now - PV.lastBuild < (busy ? 400 : 120)) return;
  PV.lastBuild = now;
  PV.builtVer = ED.ver;
  PV.sizeDirty = false;
  const camIt = cams.find((c) => c.id === PV.camId);
  if (!camIt) { pvMeta.textContent = ''; pvMessage('Plaats een camera om hier het beeld te zien.'); return; }
  pvMessage('');
  const items = displayItems();
  const ci = items.find((i) => i.id === camIt.id) || camIt;
  pvBuild(items, ci);
  const body = pvCv.parentElement, w = Math.max(10, body.clientWidth), h = Math.max(10, body.clientHeight);
  PV.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  PV.renderer.setSize(w, h, false);
  const asp = w / h, hf = clamp(ci.fov, 4, 150) * D2R;
  PV.cam.aspect = asp;
  PV.cam.fov = 2 * Math.atan(Math.tan(hf / 2) / asp) * R2D;
  PV.cam.updateProjectionMatrix();
  const ch = ci.height || 150, a = ci.rot * D2R;
  PV.cam.position.set(ci.x + Math.cos(a) * 18, ch, ci.y + Math.sin(a) * 18);
  const ct = (ci.tilt || 0) * D2R;
  PV.cam.lookAt(ci.x + Math.cos(a) * Math.cos(ct) * 400, ch - Math.sin(ct) * 400, ci.y + Math.sin(a) * Math.cos(ct) * 400);
  PV.renderer.render(PV.scene, PV.cam);
  pvMeta.textContent = `${lensFromFov(ci.fov)}mm · ${fmtM(ch)} hoog`;
}

/* =====================================================================
   Mini 3D view inside the properties popup of a lamp or camera, with
   handles for height (violet), pan (blue ring) and tilt (amber arc).
   ===================================================================== */
const MV = { renderer: null, scene: null, cam: null, cv: null, id: null, yaw: 0, drag: null, raf: 0, pick: [] };
function mvHeight(it) { return it.type === 'camera' ? (it.height || 150) : lampHeight(it); }
function mvTilt(it) { return it.type === 'camera' ? (it.tilt || 0) : (it.tilt != null ? it.tilt : autoTilt(it)); }
function mvCanH(it) { return !(it.type === 'lamp' && it.kind === 'practical' && PRAC_AUTO[it.prac]); }
function mvCanPan(it) { return !(it.type === 'lamp' && it.kind === 'practical' && it.prac !== 'tube'); }
function mvCanTilt(it) { return !(it.type === 'lamp' && lampOmni(it)); }
function mvHud(it) {
  const el = $('#mvHud', popup);
  if (!el) return;
  const parts = ['Hoogte ' + fmtM(Math.round(mvHeight(it)))];
  if (mvCanPan(it)) parts.push('Pan ' + Math.round(normDeg(it.rot)) + '°');
  if (mvCanTilt(it)) parts.push('Tilt ' + Math.round(mvTilt(it)) + '°');
  el.textContent = parts.join(' · ');
}
function mvAttach(it) {
  const host = $('#mvHost', popup);
  if (!host) return;
  if (!MV.cv) { MV.cv = document.createElement('canvas'); MV.cv.className = 'mv-cv'; mvWire(MV.cv); }
  host.prepend(MV.cv);
  if (MV.id !== it.id) { MV.id = it.id; MV.yaw = 0; }
  mvHud(it);
  loadThree().then(() => {
    const T = window.THREE;
    if (!MV.renderer) {
      try {
        MV.renderer = new T.WebGLRenderer({ canvas: MV.cv, antialias: true });
        MV.renderer.shadowMap.enabled = true;
        MV.renderer.shadowMap.type = T.PCFShadowMap;
        MV.renderer.outputEncoding = T.sRGBEncoding;
        MV.renderer.toneMapping = T.ACESFilmicToneMapping;
        MV.cam = new T.PerspectiveCamera(38, 1.6, 5, 5000);
      } catch (_) { host.classList.add('off'); return; }
    }
    mvQueue();
  }).catch(() => host.classList.add('off'));
}
function mvQueue() {
  if (MV.raf || !MV.renderer) return;
  MV.raf = requestAnimationFrame(() => { MV.raf = 0; mvDraw(); });
}
function mvDraw() {
  const it = byId(MV.id), host = $('#mvHost', popup);
  if (!it || !host || !MV.cv.isConnected) return;
  const T = window.THREE;
  const w = Math.max(10, host.clientWidth), h = Math.max(10, host.clientHeight);
  MV.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  MV.renderer.setSize(w, h, false);
  if (MV.scene) pvDispose(MV.scene);
  const copy = Object.assign(clone(it), { x: 0, y: 0 });
  const sc = buildScene3D([copy], null, { mini: true });
  MV.scene = sc;
  MV.pick = [];
  const H = mvHeight(it), a = it.rot * D2R, tilt = mvTilt(it) * D2R;
  const basic = (c) => new T.MeshBasicMaterial({ color: c, toneMapped: false });
  const ball = (c) => {
    const g = new T.Group();
    const top = (m) => { m.renderOrder = 10; m.material.depthTest = false; m.material.transparent = true; return m; };
    g.add(top(new T.Mesh(new T.SphereGeometry(8.5, 20, 14), new T.MeshBasicMaterial({ color: '#ffffff', toneMapped: false, opacity: 0.95 }))));
    g.add(top(new T.Mesh(new T.SphereGeometry(6.8, 24, 16), new T.MeshBasicMaterial({ color: c, toneMapped: false }))));
    g.children[1].renderOrder = 11;
    return g;
  };
  const grab = (mesh, k) => {
    sc.add(mesh);
    mesh.updateMatrixWorld(true);
    const hit = new T.Mesh(new T.SphereGeometry(15, 10, 8), new T.MeshBasicMaterial({ visible: false }));
    mesh.getWorldPosition(hit.position);
    hit.userData.k = k;
    sc.add(hit);
    MV.pick.push(hit);
  };
  if (mvCanH(it)) {
    const stem = new T.Mesh(new T.CylinderGeometry(0.7, 0.7, 26, 8), basic('#8b7cff'));
    stem.position.set(0, H + 20, 0);
    sc.add(stem);
    const up = ball('#8b7cff');
    up.position.set(0, H + 34, 0);
    grab(up, 'h');
  }
  if (mvCanPan(it)) {
    const ring = new T.Mesh(new T.TorusGeometry(62, 0.9, 8, 96), basic('#38bdf8'));
    ring.rotation.x = Math.PI / 2;
    ring.position.set(0, H, 0);
    sc.add(ring);
    const kn = ball('#38bdf8');
    kn.position.set(Math.cos(a) * 62, H, Math.sin(a) * 62);
    grab(kn, 'pan');
  }
  if (mvCanTilt(it)) {
    const g = new T.Group();
    g.position.set(0, H, 0);
    g.rotation.y = -a;
    sc.add(g);
    const arc = new T.Mesh(new T.TorusGeometry(46, 0.9, 8, 64, Math.PI * 0.75), basic('#fbbf24'));
    arc.rotation.z = -Math.PI / 2;
    g.add(arc);
    const beam = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, 46, 6), basic('#fde68a'));
    beam.position.set(Math.cos(-tilt) * 23, Math.sin(-tilt) * 23, 0);
    beam.rotation.z = -tilt - Math.PI / 2;
    g.add(beam);
    const kn = ball('#fbbf24');
    kn.position.set(Math.cos(-tilt) * 46, Math.sin(-tilt) * 46, 0);
    g.add(kn);
    g.updateMatrixWorld(true);
    const hit = new T.Mesh(new T.SphereGeometry(15, 10, 8), new T.MeshBasicMaterial({ visible: false }));
    kn.getWorldPosition(hit.position);
    hit.userData.k = 'tilt';
    sc.add(hit);
    MV.pick.push(hit);
  }
  // camera: three-quarter view from the front side, orbit with MV.yaw
  // frame the head of the lamp / camera with its handles
  const small = it.type === 'lamp' && it.kind === 'practical' && PRAC_AUTO[it.prac];
  const cy = small ? 60 : H - 8;
  const D = small ? 210 : 220;
  const yaw = a + 2.2 + MV.yaw;
  MV.cam.aspect = w / h;
  MV.cam.updateProjectionMatrix();
  MV.cam.position.set(Math.cos(yaw) * D, cy + 95, Math.sin(yaw) * D);
  MV.cam.lookAt(0, cy + 6, 0);
  MV.renderer.render(sc, MV.cam);
  mvHud(it);
}
function mvRay(e) {
  const T = window.THREE, r = MV.cv.getBoundingClientRect();
  const ndc = new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const rc = new T.Raycaster();
  rc.setFromCamera(ndc, MV.cam);
  return rc;
}
function mvWire(cv) {
  cv.addEventListener('pointerdown', (e) => {
    if (!MV.renderer || !MV.scene) return;
    e.stopPropagation();
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const it = byId(MV.id);
    if (!it) return;
    const hit = mvRay(e).intersectObjects(MV.pick)[0];
    MV.drag = hit ? { k: hit.object.userData.k, sx: e.clientX, sy: e.clientY, h0: mvHeight(it) } : { k: 'orbit', sx: e.clientX, yaw0: MV.yaw };
    cv.style.cursor = 'grabbing';
  });
  cv.addEventListener('pointermove', (e) => {
    const d = MV.drag;
    if (!MV.renderer || !MV.scene) return;
    if (!d) { cv.style.cursor = mvRay(e).intersectObjects(MV.pick).length ? 'pointer' : 'grab'; return; }
    const it = byId(MV.id);
    if (!it) return;
    if (d.k === 'orbit') { MV.yaw = d.yaw0 + (e.clientX - d.sx) * 0.012; mvQueue(); return; }
    const T = window.THREE, H = mvHeight(it), a = it.rot * D2R, rc = mvRay(e), q = new T.Vector3();
    if (d.k === 'h') {
      const r = cv.getBoundingClientRect();
      const dd = MV.cam.position.distanceTo(new T.Vector3(0, H, 0));
      const wpp = (2 * dd * Math.tan((MV.cam.fov * D2R) / 2)) / r.height;
      it.height = Math.round(clamp(d.h0 - (e.clientY - d.sy) * wpp, it.type === 'camera' ? 20 : 30, 450) / 5) * 5;
    } else if (d.k === 'pan') {
      if (rc.ray.intersectPlane(new T.Plane(new T.Vector3(0, 1, 0), -H), q)) it.rot = normDeg(Math.round((Math.atan2(q.z, q.x) * R2D) / 5) * 5);
    } else if (d.k === 'tilt') {
      if (rc.ray.intersectPlane(new T.Plane(new T.Vector3(-Math.sin(a), 0, Math.cos(a)), 0), q)) {
        const hor = q.x * Math.cos(a) + q.z * Math.sin(a), ver = q.y - H;
        it.tilt = clamp(Math.round(Math.atan2(-ver, hor) * R2D), it.type === 'camera' ? -45 : -30, 90);
      }
    }
    touch();
    mvQueue();
  });
  const end = () => {
    const d = MV.drag;
    MV.drag = null;
    cv.style.cursor = 'grab';
    if (d && d.k !== 'orbit') { commit(); refreshPopup(); }
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}

/* =====================================================================
   Boot
   ===================================================================== */
buildPalette();
if ('ResizeObserver' in window) new ResizeObserver(() => { if (ED.proj) resize(); }).observe(stage);
window.addEventListener('resize', () => { if (ED.proj) { resize(); if (ED.settings.preview) pvApplySize(); if (popupFor) positionPopup(byId(popupFor)); } });
if (!loadProjects().length) createProject('Voorbeeld: interview', tplInterview(), false);
renderDash();
requestAnimationFrame(frame);
Cloud.init(() => { if (!ED.proj) renderDash(); });
window.__lichtplan = { ED, computeLight, openProject, PV };
window.__aurialMV = MV;
})();
</script>
